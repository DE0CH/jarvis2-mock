name: ios
on:
  push:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (app + mock server)
        run: |
          (cd app && npm ci --no-audit --no-fund)
          (cd server && npm install --no-audit --no-fund)
      - name: Mock backend on the runner (the simulator reaches it at 127.0.0.1)
        run: |
          mkdir -p out
          nohup node server/mock-server.js 18080 > out/mock-server.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:18080/api/state > /dev/null && echo mock up
      - name: JS bundle (runs inside the extension)
        working-directory: app
        run: |
          mkdir -p ios/Extension/res
          EXPO_PUBLIC_JARVIS_BASE=http://127.0.0.1:18080/ npx expo export:embed --platform ios --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output ios/Extension/main.jsbundle --assets-dest ios/Extension/res
          mkdir -p ios/Extension/res/assets && ls -la ios/Extension/main.jsbundle
      - run: brew install xcodegen
      - name: Generate project + pods
        working-directory: app/ios
        run: xcodegen generate && pod install
      - name: Boot simulator + stream logs
        run: |
          xcrun simctl boot "iPhone 17" || true
          xcrun simctl bootstatus "iPhone 17" -b
          nohup xcrun simctl spawn "iPhone 17" log stream --style compact --level debug \
            --predicate 'process == "JarvisUI" OR process == "Jarvis2"' > out/sim.log 2>&1 &
      - name: Build for testing
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace Jarvis2.xcworkspace -scheme Jarvis2 \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath ../../dd 2>&1 | tee ../../xcodebuild.log | grep -E "error:|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED" ../../xcodebuild.log
      - name: UI test, light then dark
        working-directory: app/ios
        run: |
          for a in light dark; do
            xcrun simctl ui "iPhone 17" appearance $a
            TEST_RUNNER_JARVIS2_APPEARANCE=$a xcodebuild test-without-building -workspace Jarvis2.xcworkspace -scheme Jarvis2 \
              -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath ../../dd \
              -resultBundlePath ../../result-$a.xcresult 2>&1 | tee -a ../../xcodebuild.log | grep -E "error:|Test Case|\*\* " || true
          done
          grep -q "TEST EXECUTE SUCCEEDED\|TEST EXECUTE FAILED\|TEST SUCCEEDED\|TEST FAILED" ../../xcodebuild.log
      - name: Export results
        if: always()
        run: |
          for a in light dark; do mkdir -p out/$a; xcrun xcresulttool export attachments --path result-$a.xcresult --output-path out/$a || true; done
          tail -c 300000 xcodebuild.log > out/xcodebuild-tail.log || true
          grep -n "error:" xcodebuild.log | head -100 > out/errors.txt || true
          mkdir -p out/crash
          find ~/Library/Logs/DiagnosticReports -newer package.json -name "*.ips" -exec cp {} out/crash/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: out
